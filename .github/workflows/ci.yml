name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos das rotas
        run: npx next typegen

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes unitários
        run: npm run test:unit

      # Postgres 17 descartável, criado pelo próprio teste (embedded-postgres).
      - name: Testes de integração
        run: npm run test:integration

      # O build não acessa banco: as páginas são geradas por requisição.
      - name: Build
        run: npm run build
        env:
          APP_URL: https://ci.invalid
          DATABASE_URL: postgresql://sem-banco:sem-banco@127.0.0.1:1/sem_banco
